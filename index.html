<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔎 Bahrain Job Finder 🇧🇭</title>
<meta name="description" content="Free and simple Bahrain job finder.">
<style>
:root{--bg:#0a1a33;--bg2:#10264a;--card:#d9dde3;--ink:#14213d;--mut:#4a5568;--accent:#2f6fde;--ok:#1f8a4c}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#eef2f7;font:17px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 110px}
h1{font-size:18px;margin:4px 0 14px;color:#cfd8e6;cursor:pointer}
.hidden{display:none!important}
.hero{text-align:center;font-size:72px;line-height:1;margin:18px 0 6px}
h2{font-size:26px;text-align:center;margin:6px 0 20px}
.tagbox{background:var(--card);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:62px}
.tagbox input{flex:1;min-width:150px;border:0;background:transparent;color:var(--ink);font-size:19px;padding:10px;outline:none}
.tag{background:var(--accent);color:#fff;border-radius:18px;padding:8px 12px;font-size:16px;font-weight:600}.tag b{cursor:pointer;margin-left:8px}
.or{text-align:center;color:#a9b8d0;margin:14px 0;font-size:15px}
select.field,.dd>button{width:100%;background:var(--card);color:var(--ink);border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:left}
.dd{position:relative}.dd>button::after,.selwrap::after{content:"▾";position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--ink);pointer-events:none}
.selwrap{position:relative}
.dd>button{padding-right:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:#fff;color:var(--ink);border-radius:16px;box-shadow:0 10px 30px #000a;z-index:20;max-height:60vh;overflow:auto;padding:6px}
.panel label{display:flex;gap:12px;align-items:center;padding:13px 12px;font-size:17px;border-radius:10px;cursor:pointer}
.panel label:hover{background:#eef1f5}.panel input[type=checkbox]{width:22px;height:22px}
.panel .done{width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:700;margin-top:6px;cursor:pointer;position:sticky;bottom:0}
.panel .own{width:100%;border:1px solid #b8c0cc;border-radius:10px;padding:12px;font-size:16px;margin:4px 0}
.skip{display:block;margin:18px auto 0;background:none;border:0;color:#9fc0ff;font-size:15px;text-decoration:underline;cursor:pointer}
.navbar{position:fixed;left:0;right:0;bottom:0;background:#0a1a33f0;border-top:1px solid #1d3a66;padding:12px 16px}
.navbar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;background:var(--accent);color:#fff;border:0;border-radius:16px;padding:17px;font-size:18px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45}.btn.sec{flex:0 0 auto;background:var(--card);color:var(--ink);padding:17px 20px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.top .what{font-size:15px;color:#cfd8e6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk{background:none;border:0;color:#9fc0ff;font-size:15px;cursor:pointer;padding:6px 0;white-space:nowrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.row2 select.field,.row2 .dd>button{font-size:15px;padding:13px 30px 13px 12px;border-radius:14px}
.row2 .dd>button::after,.row2 .selwrap::after{right:10px}
.count{color:#a9b8d0;font-size:15px;margin:4px 0 12px;display:flex;justify-content:space-between}
.job{background:var(--card);color:var(--ink);border-radius:16px;padding:14px;margin-bottom:12px;position:relative}
.job .t{font-weight:800;font-size:17px;line-height:1.3;padding-right:40px}.job .c{font-weight:700;color:#253858;margin-top:3px}
.job .m{color:var(--mut);font-size:15px;margin-top:3px}
.job .src{color:#6b7689;font-size:13px;margin-top:2px}
.star{position:absolute;top:8px;right:8px;background:none;border:0;font-size:24px;cursor:pointer;padding:4px;filter:grayscale(1);opacity:.5}
.star.on{filter:none;opacity:1}
.apply{display:block;text-align:center;background:var(--ok);color:#fff;text-decoration:none;border-radius:12px;padding:14px;font-weight:800;font-size:17px;margin-top:12px}
.empty{background:var(--bg2);border-radius:16px;padding:22px;text-align:center;color:#a9b8d0}
.more{width:100%;background:var(--bg2);color:#eef2f7;border:1px solid #1d3a66;border-radius:14px;padding:15px;font-weight:700;font-size:16px;cursor:pointer}
.foot{color:#7f90ad;font-size:12px;text-align:center;margin-top:18px}
</style></head><body><div class="wrap">
<h1 id="home">🔎 Bahrain Job Finder 🇧🇭</h1>
<section id="step1" class="hidden">
 <div class="hero">😊</div>
 <h2>What are you looking for?</h2>
 <div class="tagbox" id="roleBox"><span id="roleTags" style="display:contents"></span><input id="roleIn" autocomplete="off" enterkeyhint="done" placeholder="Type a job, e.g. accountant"></div>
 <div class="or">or</div>
 <div class="selwrap"><select id="pick" class="field"><option value="">👇 Pick a role</option></select></div>
 <button class="skip" id="anyJob">Skip, show any job</button>
</section>

<section id="step2" class="hidden">
 <div class="hero">🏢</div>
 <h2>Which sector?</h2>
 <div class="dd" id="secDD"><button id="secBtn">🌐 Any sector</button><div class="panel hidden" id="secPanel"></div></div>
</section>

<section id="step3" class="hidden">
 <div class="top"><span class="what" id="what"></span><button class="lnk" id="changeBtn">✏️ Change search</button></div>
 <div class="row2">
  <div class="selwrap"><select id="fDate" class="field">
   <option value="new">📅 Newest first</option><option value="old">📅 Oldest first</option>
   <option value="1">📅 Last 24 hours</option><option value="7">📅 Last 7 days</option><option value="30">📅 Last 30 days</option></select></div>
  <div class="dd" id="exDD"><button id="exBtn">🚫 Exclude: none</button><div class="panel hidden" id="exPanel"></div></div>
 </div>
 <div class="count"><span id="count">⏳ Loading jobs…</span><button class="lnk" id="savedBtn">⭐ Saved</button></div>
 <div id="list"></div>
 <div class="foot" id="fetched"></div>
 <div class="foot">🔒 Your search stays in this browser only.</div>
</section>
</div>

<div class="navbar" id="nav"><div class="in">
 <button class="btn sec hidden" id="backBtn">⬅️ Back</button>
 <button class="btn" id="nextBtn">Next ➡️</button>
</div></div>
<script>
const $=id=>document.getElementById(id);
const K="bjf_";
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(K+k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(K+k,JSON.stringify(v))};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// sector inference from company name + title keywords
const SECTORS=[
 ["Banking","🏦",/\bbank|banking|\bnbb\b|\bbbk\b|\bbisb\b|ithmaar|\bkfh\b|kuwait finance house|al salam|khaleeji|\bhsbc\b|standard chartered|\bciti(bank|group)?\b|arab banking|\bbank abc\b|ahli united|gulf international bank|\bgib\b|alubaf|\bsico\b/i],
 ["Finance / Investment","💹",/invest|capital|asset management|\bfunds?\b|securities|wealth|brokerage|exchange house|fintech|\bpayments?\b|crypto|binance|tamara|credimax|financ|leasing|apex group/i],
 ["Insurance","🛡️",/insurance|takaful|\baxa\b|\bgig\b|solidarity|nextcare|reinsurance|marsh|\bwillis|\baon\b|medgulf|\barig\b/i],
 ["Government / Semi-gov","🏛️",/ministry|authority|government|tamkeen|mumtalakat|economic development board|\bedb\b|\blmra\b|council|municipal|kingdom of bahrain|\bcbb\b|central bank|nogaholding/i],
 ["Oil & Gas / Energy","🛢️",/\bbapco|\boil\b|\bgas\b|energy|petroleum|\balba\b|aluminium|aluminum|tatweer|\bpower\b|solar|banagas|petrochem|\bgpic\b|electricity|\bewa\b|utilities/i],
 ["Telecom","📡",/batelco|beyon|\bstc\b|\bzain\b|telecom|kalaam|vodafone/i],
 ["Tech / Startups","💻",/software|technolog|\btech\b|digital|\bit solutions|startup|\bsaas\b|cloud|\bdata\b|cyber|careem|talabat|\bai\b|e-?commerce|developer|\bit\b|oracle|\bdeel\b|microsoft|amazon web|\baws\b|google/i],
 ["Healthcare","🏥",/hospital|health|medical|clinic|pharma|dental|\bnurse|nursing|physician|doctor|laborator|\bkims\b|king hamad|salmaniya|optic/i],
 ["Hospitality / Tourism","🏨",/hotel|resort|hospitality|restaurant|\bcafe|coffee|catering|travel|tourism|\btours?\b|gulf air|airline|airport|ritz|four seasons|hilton|marriott|wyndham|sofitel|jumeirah|swiss-?belhotel|rotana|\bf&b|food & beverage|\bchef\b|kitchen|barista|housekeep|front office|voyage|cruise|\bspa\b|westin|sheraton|tribute portfolio|cipriani|silversea|hyatt|kempinski|accor|novotel|movenpick|intercontinental/i],
 ["Retail","🛍️",/retail|\bstore\b|\bmall\b|fashion|supermarket|hypermarket|lulu|carrefour|alshaya|apparel|boutique|\bshop\b|m&s|ikea|cashier|merchandis|showroom|jewel|cosmetic|sharaf dg|centrepoint|landmark group|lvmh|fendi|louis vuitton|azadea|chalhoub|euro motors|showroom/i],
 ["Logistics","🚚",/logistic|shipping|freight|cargo|\bdhl\b|aramex|fedex|\bups\b|warehouse|transport|\bport\b|apm terminals|supply chain|courier|delivery|fleet|\bdriver|kanoo|cma cgm|svitzer|maersk/i],
 ["Construction / Engineering","🏗️",/construct|engineering|contracting|contractor|\bcivil\b|\bmep\b|architect|infrastructure|almoayyed|site engineer|surveyor|hvac|fit-?out|\bmaintenance\b|project engineer|mechanical|electrical|\bnass\b|aecom|yokogawa|sulzer|enerflex|elevator|pramac/i],
 ["Education","🎓",/school|university|college|academy|education|institute|training cent|polytechnic|\baubh\b|teacher|lecturer|tutor|nursery|kindergarten/i],
 ["Real Estate","🏢",/real estate|property|properties|realty|\bdevelopments?\b|facility management|facilities|diyar|eagle hills/i],
 ["Consulting","🧭",/consult|advisory|deloitte|\bpwc\b|\bkpmg\b|\bey\b|ernst|accenture|mckinsey|\bbain\b|\bbcg\b|grant thornton|\bbdo\b|\brsm\b|crowe|talal abu/i],
 ["Manufacturing","🏭",/manufactur|factory|industr|\bplant\b|production|packaging|steel|plastic|bottling|printing|chemical|fabricat|mondel[eē]z|linde|nestl[eé]|unilever|pepsi|coca/i]];
const RAW_FALLBACK=["https:/","raw.githubusercontent.com","akprojects91","jobhub","main","data","live.json"].join("/");
async function getJson(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
const ROLES=["Accountant","Administration","Customer service","Driver","Engineer","HR","IT support","Marketing","Nurse","Sales","Software developer","Teacher"];
const EXCL=[["senior","👔 Senior / Manager roles",/\bsenior\b|\bsr\b|\bmanager\b|\bhead of\b|\bdirector\b|\blead\b|\bchief\b|\bvp\b|vice president|supervisor/i],
 ["intern","🎓 Internships",/\bintern(ship)?s?\b|\btrainee\b/i],
 ["sales","💼 Sales",/\bsales\b|business development|\btelesales\b/i],
 ["cs","☎️ Customer service",/customer service|customer care|call cent|call center|contact cent/i],
 ["part","⏱️ Part-time",/part[- ]time/i]];
let S=Object.assign({roles:[],any:false,sectors:[],custom:[],done:false},store.get("flow2",{}));
let F=Object.assign({date:"new",ex:[]},store.get("filters2",{}));
const save=()=>{store.set("flow2",S);store.set("filters2",F)};
const has=t=>S.roles.some(x=>x.toLowerCase()===t.toLowerCase());
function addRole(t){t=t.trim().replace(/\s+/g," ").slice(0,60);if(t&&!has(t))S.roles.push(t);S.any=false;save();drawRoles()}
function drawRoles(){$("roleTags").innerHTML=S.roles.map((t,i)=>`<span class="tag">${esc(t)}<b data-i="${i}">✕</b></span>`).join("");
 document.querySelectorAll("#roleTags [data-i]").forEach(b=>b.onclick=()=>{S.roles.splice(+b.dataset.i,1);save();drawRoles()});nav()}
const roleIn=$("roleIn");
const takeInput=()=>{const v=roleIn.value;roleIn.value="";v.split(/[,;]/).forEach(addRole)};
roleIn.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();takeInput()}else if(e.key==="Backspace"&&!roleIn.value&&S.roles.length){S.roles.pop();save();drawRoles()}};
roleIn.oninput=()=>{if(/[,;]/.test(roleIn.value))takeInput();else nav()};
$("roleBox").onclick=e=>{if(e.target.id==="roleBox")roleIn.focus()};
$("pick").innerHTML+=ROLES.map(r=>`<option>${r}</option>`).join("");
$("pick").onchange=()=>{if($("pick").value)addRole($("pick").value);$("pick").value=""};
$("anyJob").onclick=()=>{S.roles=[];S.any=true;save();go("step2")};
// ---------- checkbox dropdowns ----------
function dropdown(btn,panel,items,getSel,setSel,label,extra){
 const draw=()=>{const sel=getSel();
  panel.innerHTML=(typeof items==="function"?items():items).map(([v,l])=>`<label><input type="checkbox" value="${esc(v)}" ${sel.includes(v)?"checked":""}> ${esc(l)}</label>`).join("")+(extra?extra():"")+`<button class="done">✅ Done</button>`;
  panel.querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=()=>{setSel([...panel.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value));btn.textContent=label()});
  panel.querySelector(".done").onclick=e=>{e.stopPropagation();close()};
  if(extra&&panel.querySelector(".own"))panel.querySelector(".own").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const v=e.target.value.trim();if(v&&!S.custom.includes(v)){S.custom.push(v);save()}draw();btn.textContent=label()}}};
 const close=()=>{panel.classList.add("hidden");onDDClose()};
 btn.onclick=e=>{e.stopPropagation();const open=panel.classList.contains("hidden");document.querySelectorAll(".panel").forEach(p=>p.classList.add("hidden"));if(open){draw();panel.classList.remove("hidden")}else close()};
 panel.onclick=e=>e.stopPropagation();
 btn.textContent=label();return{refresh:()=>{btn.textContent=label()}}}
document.addEventListener("click",()=>{let was=false;document.querySelectorAll(".panel").forEach(p=>{if(!p.classList.contains("hidden"))was=true;p.classList.add("hidden")});if(was)onDDClose()});
function onDDClose(){save();if(cur==="step3")render(true);nav()}
const secItems=()=>[["","🌐 Any sector"],...SECTORS.map(([n,e])=>[n,e+" "+n]),...S.custom.map(c=>["custom:"+c,"✍️ "+c])];
const secDD=dropdown($("secBtn"),$("secPanel"),secItems,()=>[...(S.sectors.length||S.custom.length?[]:[""]),...S.sectors,...S.custom.map(c=>"custom:"+c)],
 v=>{const prevAny=!S.sectors.length&&!S.custom.length;
  if(v.includes("")&&!prevAny){S.sectors=[];S.custom=[]}else{v=v.filter(x=>x);S.sectors=v.filter(x=>!x.startsWith("custom:"));S.custom=v.filter(x=>x.startsWith("custom:")).map(x=>x.slice(7))}
  save();setTimeout(()=>{$("secPanel").querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=c.value===""?!S.sectors.length&&!S.custom.length:S.sectors.includes(c.value)||S.custom.includes(c.value.slice(7)))},0)},
 ()=>{const n=[...S.sectors,...S.custom];return n.length?(n.length<=2?"🏢 "+n.join(", "):`🏢 ${n.length} sectors`):"🌐 Any sector"},
 ()=>`<input class="own" placeholder="✍️ Type another sector, press Enter">`);
// ---------- matching ----------
const STOP=new Set(["and","or","of","the","in","jobs","job","a","for","officer","specialist","executive","manager","analyst","assistant","associate","senior","junior","staff","bahrain"]);
const ALIAS={accountant:["accountant","accounting"," accounts "],accounting:["accountant","accounting"," accounts "]};
const words=t=>(t.toLowerCase().match(/[a-z0-9&]+/g)||[]);
const stem=w=>w.length>5?w.slice(0,Math.max(4,w.length-3)):w;
function hits(phrase,text){let ws=words(phrase);const core=ws.filter(w=>!STOP.has(w));if(core.length)ws=core;if(!ws.length)return false;
 const hay=" "+text.toLowerCase().replace(/[^a-z0-9&]+/g," ")+" ";
 const ok=w=>ALIAS[w]?ALIAS[w].some(x=>hay.includes(x)):w.length<=3?hay.includes(" "+w+" "):hay.includes(stem(w));const n=ws.filter(ok).length;return n>=(ws.length<=2?ws.length:Math.ceil(ws.length*.6))}
function salaryOf(j){const t=(j.salary||"")+" "+j.title;const m=t.match(/(?:bhd|bd)\s?([\d,]{3,6})(?:\s?[-–to]+\s?(?:bhd|bd)?\s?([\d,]{3,6}))?|([\d,]{3,6})\s?(?:[-–]\s?([\d,]{3,6}))?\s?(?:bhd|bd)\b/i);
 if(!m)return null;const a=+(m[1]||m[3]).replace(/,/g,""),b=+((m[2]||m[4]||"").replace(/,/g,""))||a;return{min:a,max:b}}
function locOk(j){if(F.loc==="Any")return true;const l=(j.location||"").toLowerCase();
 if(F.loc.startsWith("Remote"))return/remote|hybrid/.test(l);
 if(l.includes(F.loc.toLowerCase().split(" ")[0]))return true;
 return F.locLoose&&!AREAS.slice(1).some(a=>l.includes(a.toLowerCase().split(" ")[0]))}
const sectorsOf=j=>{const t=(j.company||"")+" | "+j.title;return SECTORS.filter(x=>x[2].test(t)).map(x=>x[0])};
const daysAgo=d=>Math.floor((Date.now()-new Date(d+"T12:00:00Z"))/864e5);
function ago(d){if(!d)return"date not shown";const n=daysAgo(d);return n<=0?"today":n===1?"1 day ago":n+" days ago"}
const exDD=dropdown($("exBtn"),$("exPanel"),()=>[["","✅ None"],...EXCL.map(([k,l])=>[k,l])],()=>F.ex.length?F.ex:[""],
 v=>{const prevNone=!F.ex.length;F.ex=v.includes("")&&!prevNone?[]:v.filter(x=>x);save();
  setTimeout(()=>{$("exPanel").querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=c.value===""?!F.ex.length:F.ex.includes(c.value))},0);render(true)},
 ()=>F.ex.length?(F.ex.length===1?"🚫 "+EXCL.find(x=>x[0]===F.ex[0])[1].replace(/^\S+ /,""):`🚫 Excluding ${F.ex.length}`):"🚫 Exclude: none");
$("fDate").onchange=()=>{F.date=$("fDate").value;save();render(true)};

// ---------- steps (one hash per step so the back button works) ----------
const STEPS=["step1","step2","step3"];let cur="";
const ready=()=>S.roles.length>0||S.any;
function go(step,replace){const h="#"+step;if(location.hash!==h){if(replace)history.replaceState(null,"",h);else history.pushState(null,"",h)}show(step)}
function show(step){cur=step;document.querySelectorAll(".panel").forEach(p=>p.classList.add("hidden"));
 STEPS.forEach(s=>$(s).classList.toggle("hidden",s!==step));
 if(step==="step1")drawRoles();
 if(step==="step2")secDD.refresh();
 if(step==="step3"){S.done=true;save();showResults()}
 nav();window.scrollTo(0,0)}
function nav(){const n=$("nextBtn");$("nav").classList.toggle("hidden",cur==="step3");$("backBtn").classList.toggle("hidden",cur!=="step2");
 if(cur==="step1"){n.textContent="Next ➡️";n.disabled=!S.roles.length&&!S.any&&!roleIn.value.trim()}
 if(cur==="step2"){n.textContent="🔎 Show jobs";n.disabled=false}}
$("nextBtn").onclick=()=>{if(cur==="step1"){takeInput();if(!ready())return;go("step2")}else if(cur==="step2")go("step3")};
$("backBtn").onclick=()=>go("step1");
window.addEventListener("popstate",()=>show(fromHash()));
function fromHash(){const h=location.hash.slice(1);
 if(h==="step1")return h;if(h==="step2"||h==="step3")return ready()?h:"step1";
 return S.done&&ready()?"step3":"step1"}
$("home").onclick=()=>go("step1");
$("changeBtn").onclick=()=>go("step1");
// ---------- data + results ----------
let DATA=null,JOBS=[],shown=30,savedOnly=false;
async function load(){if(DATA)return;const bust="?t="+Math.floor(Date.now()/60000);let d;
 try{d=await getJson("data/live.json"+bust)}catch(e){d=await getJson(RAW_FALLBACK+bust)}
 JOBS=d.jobs.map(j=>({...j,sources:j.sources||[],links:j.links||{},sec:sectorsOf(j)}));DATA=d;
 const when=new Date(d.fetched_at).toLocaleString("en-GB",{timeZone:"Asia/Bahrain",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
 $("fetched").textContent=`🕒 ${JOBS.length} Bahrain listings · updated ${when} Bahrain time · refreshes every 6 hours`}
const ST=()=>store.get("status",{});
function toggleSave(id){const s=ST();if(s[id]&&s[id].status==="Saved")delete s[id];else s[id]={status:"Saved",updated:new Date().toISOString()};store.set("status",s);render(false)}
$("savedBtn").onclick=()=>{savedOnly=!savedOnly;render(true)};
async function showResults(){savedOnly=false;$("fDate").value=F.date;exDD.refresh();
 const r=S.roles.length?S.roles.join(", "):"Any job",sc=[...S.sectors,...S.custom];
 $("what").textContent="🔎 "+r+" · "+(sc.length?sc.join(", "):"any sector");
 if(!DATA){$("count").textContent="⏳ Loading jobs…";$("list").innerHTML=""}
 try{await load()}catch(e){$("count").textContent="";$("list").innerHTML=`<div class="empty">⚠️ Couldn't load jobs. Please refresh.</div>`;return}
 render(true)}
function sectorRank(j){if(!S.sectors.length&&!S.custom.length)return 0;
 const full=j.title+" "+(j.company||"");
 if(S.sectors.some(s=>j.sec.includes(s))||S.custom.some(c=>hits(c,full)||j.sec.some(s=>s.toLowerCase().includes(c.toLowerCase()))))return 0;
 return j.sec.length?-1:1}
const SRC_NAMES={"linkedin":"LinkedIn","indeed":"Indeed","tanqeeb":"Tanqeeb","bayt":"Bayt","gulftalent":"GulfTalent","workable":"Workable","employer careers (ats)":"Careers page","ats":"Careers page","naukrigulf":"Naukrigulf","akhtaboot":"Akhtaboot"};
const srcName=s=>s?(SRC_NAMES[String(s).toLowerCase()]||(/career|ats/i.test(s)?"Careers page":s)):"Job site";
function card(j,saved){const url=j.links[j.sources[0]]||j.url;
 return `<div class="job"><button class="star ${saved?"on":""}" data-id="${esc(j.id)}" title="Save">⭐</button>
 <div class="t">${esc(j.title)}</div><div class="c">🏢 ${esc(j.company||"Company not shown")}</div>
 <div class="m">📍 ${esc(j.location||"Bahrain")}</div><div class="src">🌐 via ${esc(srcName(j.sources[0]))}</div><div class="m">🕒 ${esc(ago(j.posted))}</div>
 <a class="apply" href="${esc(url)}" target="_blank" rel="noopener">✅ Apply</a></div>`}
function render(resetPage){if(!DATA)return;if(resetPage)shown=30;const st=ST();
 const days=+F.date||0,cut=days?new Date(Date.now()-days*864e5).toISOString().slice(0,10):"";
 const ex=EXCL.filter(x=>F.ex.includes(x[0]));
 let list=JOBS.map(j=>({j,rank:sectorRank(j),saved:(st[j.id]||{}).status==="Saved"}));
 if(savedOnly)list=list.filter(x=>x.saved);
 else list=list.filter(({j,rank})=>rank>=0&&(!S.roles.length||S.roles.some(r=>hits(r,j.title)))&&(!cut||!j.posted||j.posted>=cut)&&!ex.some(x=>x[2].test(j.title)));
 const old=F.date==="old",byDate=(a,b)=>old?(a.j.posted||"9").localeCompare(b.j.posted||"9"):(b.j.posted||"").localeCompare(a.j.posted||"");
 list.sort((a,b)=>a.rank-b.rank||byDate(a,b));
 const nSaved=Object.values(st).filter(v=>v.status==="Saved").length;
 $("savedBtn").textContent=savedOnly?"⬅️ All results":`⭐ Saved (${nSaved})`;
 $("count").textContent=savedOnly?`⭐ ${list.length} saved job${list.length===1?"":"s"}`:`📋 ${list.length} job${list.length===1?"":"s"} found`;
 if(!list.length){$("list").innerHTML=`<div class="empty">${savedOnly?"Tap the ⭐ on a job to save it.":"🙈 No jobs match right now.<br><br>Try another role, or choose 🌐 Any sector."}</div>`;return}
 $("list").innerHTML=list.slice(0,shown).map(x=>card(x.j,x.saved)).join("")+(list.length>shown?`<button class="more" id="moreJobs">⬇️ Show more (${list.length-shown} left)</button>`:"");
 document.querySelectorAll(".star").forEach(b=>b.onclick=()=>toggleSave(b.dataset.id));
 if($("moreJobs"))$("moreJobs").onclick=()=>{shown+=30;render(false)}}
go(fromHash(),true);
load().catch(()=>{});
</script></body></html>
